<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administracyjny — Frasi marcate</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-head"><div class="shell head-row"><a class="brand" href="/">frasi<span>·</span>marcate</a><nav><a href="/">← Widok użytkownika</a></nav></div></header><main class="shell admin-main"><p class="eyebrow">PANEL ADMINISTRACYJNY</p><h1>Przykłady i anotacje</h1><p>Wklej rekord JSON zgodny ze <a href="/example.schema.json" target="_blank">schematem</a>. Zakresy segmentów liczone są w punktach kodowych Unicode. Publicznie widać tylko rekordy ze statusem <code>reviewed</code>.</p><div class="admin-grid"><aside class="admin-card"><label>Hasło administratora<br><input id="password" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD"></label><div class="admin-toolbar"><button id="load" class="button secondary">Wczytaj</button><button id="new" class="button secondary">Nowy rekord</button></div><div id="records" class="admin-list"></div></aside><section class="admin-card"><label for="json">Rekord JSON</label><textarea id="json" class="admin-textarea" spellcheck="false"></textarea><div class="admin-toolbar"><button id="validate" class="button secondary">Waliduj JSON</button><button id="save" class="button primary">Zapisz rekord</button><button id="delete" class="button danger">Usuń</button></div><p id="status" class="admin-status" role="status"></p></section></div></main><script src="/admin.js" defer></script></body></html>
